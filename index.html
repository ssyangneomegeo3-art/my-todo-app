<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>To-Do 리스트 (5일 차 Chart.js & 달성률 연동)</title>
  
  <!-- Chart.js 라이브러리 CDN 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial, sans-serif; }
    .todo-card { background-color: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); width: 380px; }
    h1 { margin-top: 0; color: #333; text-align: center; font-size: 22px; }

    .quote-box { background: #eef6ff; border-left: 4px solid #2196F3; padding: 15px; margin-bottom: 20px; border-radius: 6px; position: relative; min-height: 45px; }
    .quote-box p { margin: 0 0 6px 0; font-size: 13px; color: #333; font-style: italic; line-height: 1.4; }
    .quote-box span { font-size: 11px; color: #666; font-weight: bold; }
    .quote-btn { position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer; font-size: 14px; }

    .spinner {
      width: 20px; height: 20px; border: 3px solid #e0e0e0; border-top: 3px solid #2196F3;
      border-radius: 50%; animation: spin 0.8s linear infinite; display: none; margin: 10px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
    .add-btn { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

    .filter-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .filter-btn { background: #f0f0f0; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; color: #555; transition: all 0.2s; }
    .filter-btn.active { background: #2196F3; color: white; font-weight: bold; }

    /* 차트 컨테이너 및 달성률 텍스트 스타일 */
    .chart-container { width: 180px; margin: 15px auto; }
    .rate-text { text-align: center; font-size: 14px; font-weight: bold; color: #333; margin-top: 8px; }

    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #f9f9f9; padding: 10px 15px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .todo-text { cursor: pointer; flex: 1; }
    .completed { text-decoration: line-through; color: #888; }
    .delete-btn { background-color: #ff4d4f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; opacity: 0; transition: opacity 0.2s ease; }
    li:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background-color: #ff7875; }
    .empty-msg { text-align: center; color: #aaa; font-size: 13px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="todo-card">
    <h1>오늘의 할 일 목록</h1>

    <div class="quote-box">
      <div id="spinner" class="spinner"></div>
      <p id="quote"></p>
      <span id="author"></span>
      <button id="quote-btn" class="quote-btn" title="새 명언 가져오기">🔄</button>
    </div>

    <div class="input-group">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요...">
      <button id="add-btn" class="add-btn">추가</button>
    </div>

    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <!-- 차트 영역 및 달성률 출력 영역 -->
    <div class="chart-container">
      <canvas id="todoChart"></canvas>
      <div id="rate-text" class="rate-text">달성률: 0%</div>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script>
    let todos = [];
    let currentFilter = 'all';
    let todoChartInstance = null;

    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const filterBtns = document.querySelectorAll('.filter-btn');

    async function fetchQuote() {
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const spinner = document.getElementById('spinner');

      spinner.style.display = 'block';
      quoteEl.textContent = '';
      authorEl.textContent = '';

      try {
        const response = await fetch('https://korean-advice-open-api.vercel.app/api/advice');
        if (!response.ok) throw new Error('서버 응답 실패');
        const data = await response.json();
        quoteEl.textContent = `"${data.message}"`;
        authorEl.textContent = `- ${data.author}`;
      } catch (error) {
        quoteEl.textContent = '⚠️ 명언을 불러오지 못했습니다.';
      } finally {
        spinner.style.display = 'none';
      }
    }

    document.getElementById('quote-btn').addEventListener('click', fetchQuote);
    fetchQuote();

    function saveTodos() {
      localStorage.setItem('myTodos', JSON.stringify(todos));
    }

    function loadTodos() {
      const savedData = localStorage.getItem('myTodos');
      if (savedData) {
        todos = JSON.parse(savedData);
      }
      renderTodos();
    }

    // 통계 계산 및 차트/달성률 갱신 함수
    function updateChart() {
      const canvas = document.getElementById('todoChart');
      const rateEl = document.getElementById('rate-text');
      if (!canvas) return;

      const totalCount = todos.length;
      const completedCount = todos.filter(t => t.completed).length;
      const activeCount = totalCount - completedCount;

      // 1. 달성률 퍼센트 계산 (할 일이 0개일 때 0/0으로 인한 NaN 예외 처리)
      const percentage = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

      // 2. 달성률 텍스트 동기화
      if (rateEl) {
        rateEl.textContent = `달성률: ${percentage}%`;
      }

      // 3. 기존 차트 메모리 해제
      if (todoChartInstance) {
        todoChartInstance.destroy();
      }

      // 4. 차트 생성
      todoChartInstance = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: ['완료됨', '진행 중'],
          datasets: [{
            data: [completedCount, activeCount],
            backgroundColor: ['#4CAF50', '#FF9800'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, font: { size: 11 } }
            }
          }
        }
      });
    }

    function renderTodos() {
      todoList.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'empty-msg';
        emptyMsg.textContent = '해당하는 항목이 없습니다.';
        todoList.appendChild(emptyMsg);
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement('li');

          const textSpan = document.createElement('span');
          textSpan.textContent = todo.text;
          textSpan.classList.add('todo-text');
          if (todo.completed) textSpan.classList.add('completed');

          textSpan.addEventListener('click', () => {
            todo.completed = !todo.completed;
            saveTodos();
            renderTodos();
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = '삭제';
          deleteBtn.classList.add('delete-btn');
          deleteBtn.addEventListener('click', () => {
            todos = todos.filter(item => item.id !== todo.id);
            saveTodos();
            renderTodos();
          });

          li.appendChild(textSpan);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      // 데이터 변경 시 차트 및 달성률 텍스트 함께 업데이트
      updateChart();
    }

    function addTodo() {
      const text = input.value.trim();
      if (text === '') {
        alert('할 일을 입력해 주세요!');
        return;
      }

      todos.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      saveTodos();
      renderTodos();
      input.value = '';
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');

        currentFilter = e.target.dataset.filter;
        renderTodos();
      });
    });

    loadTodos();
  </script>
</body>
</html>
