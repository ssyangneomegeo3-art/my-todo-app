<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>To-Do 리스트 (6일 차 코드 모듈화)</title>

  <!-- 1. 외부 CSS 스타일시트 연동 -->
  <link rel="stylesheet" href="style.css">

  <!-- 2. Chart.js 외부 라이브러리 CDN 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="todo-card">
    <h1>오늘의 할 일 목록</h1>

    <div class="quote-box">
      <div id="spinner" class="spinner"></div>
      <p id="quote"></p>
      <span id="author"></span>
      <button id="quote-btn" class="quote-btn" title="새 명언 가져오기">🔄</button>
    </div>

    <div class="input-group">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요...">
      <button id="add-btn" class="add-btn">추가</button>
    </div>

    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <div class="chart-container">
      <canvas id="todoChart"></canvas>
      <div id="rate-text" class="rate-text">달성률: 0%</div>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <!-- 3. 분리한 내 자바스크립트 로직 연동 (body 맨 아래에 배치) -->
  <script src="app.js"></script>
</body>
</html>
